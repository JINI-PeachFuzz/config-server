server:
  port: 3999

spring:
  application:
    name: config-server # 이름 지었던거 그대로 정확하게 입력

  profiles:
    active: native,git # 적은 설정만 활성화됨

  cloud:
    config:
      server:
        native: # 컨피그 서버 특정 경로에 파일로써 설정 파일 관리 / 유연성은 매우 떨어지는 방식
          search-locations: classpath:/configs # 리소스안 폴더경로
        git:  # 원격 레포지토리에 설정파일 조회
          uri: ${repo.uri}
          searchPaths: ${repo.path}
          default-label: ${repo.branch}
